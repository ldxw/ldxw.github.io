<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RustDesk 最新版下载</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #e8eaed; } }
  .box { width: min(680px, 92vw); padding: 28px 26px; border-radius: 14px; background: #fff;
         box-shadow: 0 6px 28px rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { .box { background: #1f2229; box-shadow: none; } }
  h1 { margin: 0 0 6px; font-size: 20px; }
  .ver { color: #2b7cff; }
  p { margin: 0 0 16px; color: #666; }
  @media (prefers-color-scheme: dark) { p { color: #a9b0bb; } }
  a.btn { display: block; padding: 11px 14px; margin: 8px 0; border-radius: 10px; text-decoration: none;
          background: #eef2f8; color: #1b4b91; font-weight: 600; }
  a.btn:hover { background: #e2ebfa; }
  @media (prefers-color-scheme: dark) { a.btn { background: #262b34; color: #9dc3ff; } }
  .hint { font-size: 13px; color: #888; margin-top: 14px; }
  .warn { color: #c0392b; }
</style>
</head>
<body>
<div class="box">
  <h1>RustDesk <span class="ver" id="ver"></span></h1>
  <p id="msg">正在获取最新版本…</p>
  <div id="links"></div>
  <p class="hint" id="hint"></p>
</div>

<script>
// ====================== 配置 ======================
const REPO  = 'ldxw/rustdesk';                                  // 你的仓库
const API   = `https://api.github.com/repos/${REPO}/releases?per_page=10`;
const PAGE  = `https://github.com/${REPO}/releases`;             // 兜底：Release 页面
const PREFER_PRERELEASE = true;   // 你的 release 都是 prerelease，所以不排除它们
const CACHE_MS = 10 * 60 * 1000;  // 浏览器里缓存 10 分钟，省 API 配额（匿名每小时 60 次）

const $ = (id) => document.getElementById(id);

// ====================== 工具 ======================
function semver(tag) {                       // "1.4.9" / "v1.4.9" -> [1,4,9]
  const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(tag || '');
  return m ? m.slice(1).map(Number) : null;
}
function cmpVer(a, b) {                      // 版本降序
  for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return b[i] - a[i];
  return 0;
}
function qs(name) {                          // 支持 ?os=windows&arch=x86_64 手动指定
  return new URLSearchParams(location.search).get(name);
}

// ====================== 识别平台 ======================
function detectOS() {
  const forced = (qs('os') || '').toLowerCase();
  if (forced) return forced;
  const ua = navigator.userAgent;
  const p  = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  if (/Android/i.test(ua))                    return 'android';
  if (/iPhone|iPad|iPod/i.test(ua))           return 'ios';
  if (/Win/i.test(p) || /Windows/i.test(ua))  return 'windows';
  if (/Mac/i.test(p) || /Mac OS X/i.test(ua)) return 'macos';
  if (/Linux|X11/i.test(p) || /Linux/i.test(ua)) return 'linux';
  return 'other';
}
async function detectArch() {                // 只有 Chromium 内核能拿到真实架构
  const forced = (qs('arch') || '').toLowerCase();
  if (forced) return forced;
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const v = await navigator.userAgentData.getHighEntropyValues(['architecture']);
      if (/arm/i.test(v.architecture || '')) return 'arm';
    }
  } catch (e) {}
  // Firefox/Safari 拿不到：Mac 上苹果芯片占多数，按 arm 猜；其它平台按 x86_64
  return detectOS() === 'macos' ? 'arm' : 'x86_64';
}

// ====================== 挑文件 ======================
function pickAsset(names, os, arch) {
  const has = (...subs) => names.find(n => subs.every(s => n.toLowerCase().includes(s)));
  switch (os) {
    case 'windows':
      return has('x86_64.exe') || has('-sciter.exe') || has('.exe') || has('.msi');
    case 'macos':
      return arch === 'arm'
        ? (has('aarch64-aarch64.dmg') || has('aarch64.dmg') || has('.dmg'))
        : (has('x86_64-x86_64.dmg') || has('x86_64.dmg') || has('.dmg'));
    case 'android':
      return has('universal.apk') || has('x86_64.apk') || has('aarch64.apk') || has('.apk');
    case 'linux':
      return arch === 'arm'
        ? (has('aarch64.appimage') || has('aarch64.deb') || has('.appimage') || has('.deb'))
        : (has('x86_64.appimage') || has('x86_64.deb') || has('.appimage') || has('.deb') || has('.pkg.tar.zst'));
    default:
      return null;
  }
}

// ====================== 取数据（带缓存 + 兜底）======================
async function getReleases() {
  try {
    const raw = sessionStorage.getItem('rd_rel');
    if (raw) {
      const c = JSON.parse(raw);
      if (Date.now() - c.t < CACHE_MS) return c.d;
    }
  } catch (e) {}
  const res = await fetch(API, { headers: { 'Accept': 'application/vnd.github+json' } });
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  const list = await res.json();
  try { sessionStorage.setItem('rd_rel', JSON.stringify({ t: Date.now(), d: list })); } catch (e) {}
  return list;
}

function renderLinks(rel, note) {
  $('ver').textContent = rel ? rel.tag_name : '';
  $('links').innerHTML = '';
  if (!rel) return;
  rel.assets.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(a => {
    const el = document.createElement('a');
    el.className = 'btn';
    el.href = a.browser_download_url;
    el.textContent = `${a.name}  （${(a.size / 1048576).toFixed(1)} MB）`;
    $('links').appendChild(el);
  });
  $('hint').innerHTML = (note || '') +
    `没有自动开始？点上面的文件名手动下载；或去 <a href="${PAGE}">Release 页面</a>。`;
}

// ====================== 主流程 ======================
(async () => {
  try {
    const list = await getReleases();
    const rels = list
      .filter(r => !r.draft && r.assets && r.assets.length &&
                   (PREFER_PRERELEASE || !r.prerelease) && semver(r.tag_name))
      .sort((a, b) => cmpVer(semver(a.tag_name), semver(b.tag_name)));

    if (!rels.length) { location.replace(PAGE); return; }

    const rel   = rels[0];
    const os    = detectOS();
    const arch  = await detectArch();
    const names = rel.assets.map(a => a.name);
    const name  = pickAsset(names, os, arch);
    const asset = name ? rel.assets.find(a => a.name === name) : null;

    $('ver').textContent = rel.tag_name;

    if (asset) {
      $('msg').textContent = `已识别系统：${os} / ${arch}，正在开始下载…`;
      renderLinks(rel, `<b>${asset.name}</b> 下载已经开始（浏览器可能会问你保存到哪）。<br>`);
      // 关键：直接跳到「资产下载地址」，浏览器就会下载文件（不是跳到 Release 网页）
      location.href = asset.browser_download_url;
    } else {
      $('msg').innerHTML = '没能自动识别你的系统，请在下面手动选择：';
      renderLinks(rel, '');
    }
  } catch (e) {
    // 拿不到数据（离线 / API 限流 / file:// 限制）→ 退回 Release 页面
    document.getElementById('msg').innerHTML =
      '<span class="warn">获取版本信息失败：' + e.message + '</span><br>正在跳到 Release 页面…';
    setTimeout(() => location.replace(PAGE), 1500);
  }
})();
</script>
</body>
</html>
